name: Continuous Validation Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Execute Unit Tests
      run: |
        mkdir validation-logs
        python -m unittest discover > validation-logs/test-results.txt

    - name: Generate Validation Log
      run: |
        echo "Validation completed successfully" > validation-logs/validation-summary.txt
        date >> validation-logs/validation-summary.txt

    - name: Upload Validation Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: validation-evidence
        path: validation-logs/
